<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h1 class="logo">NETFLIX</h1>
    <button id="login-btn" class="sign-in-btn">Sign In</button>
  </nav>

  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close">&times;</span>
      <h2>Sign In</h2>
      <form id="login-form">
        <input type="email" placeholder="Email or phone number" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="submit-btn">Sign In</button>
      </form>
    </div>
  </div>

  <header class="hero" id="hero-section">
    <div class="hero-video-container" id="hero-video-container"></div>
    <div class="hero-content">
      <h1 id="hero-title">Loading...</h1>
      <p id="hero-description"></p>
      <div class="hero-buttons">
        <button class="btn play-btn">▶ Play</button>
        <button class="btn info-btn">ℹ More Info</button>
      </div>
    </div>
    <div class="hero-fade-bottom"></div>
  </header>

  <main class="main-content" id="main-content">
    </main>

  <script src="script.js"></script>
</body>
</html>
